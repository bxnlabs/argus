root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/argus ./cmd/argus"
  bin = "./tmp/argus"
  include_ext = ["go"]
  exclude_dir = ["web", "internal/web/dist", "tmp", "bin", ".dev", "docs", "node_modules"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  delay = 500

[misc]
  clean_on_exit = true
