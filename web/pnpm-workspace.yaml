# pnpm config + supply-chain hardening for argus/web.
# In pnpm 11, project settings live here (not .npmrc / package.json).

# Wait 5 days (7200 minutes) before installing a freshly published version.
# Primary defense against worms (e.g. Shai-Hulud) that rely on installs
# landing within hours of a malicious publish.
minimumReleaseAge: 7200

# Verify node_modules matches the lockfile before every `pnpm run`.
# Hard error (not warn) on drift or tampering.
verifyDepsBeforeRun: error

# Allowlist of packages permitted to run install/build lifecycle scripts.
# In pnpm 11 this is a name->bool map (replaces pnpm 10's onlyBuiltDependencies
# array); everything not listed is blocked. Keep minimal and justified — expand
# only when an install reports a genuinely-needed build. strictDepBuilds (below)
# turns an unapproved build into a hard error that names the exact package.
allowBuilds:
  esbuild: true              # vite's bundler — selects its native binary
  "@tailwindcss/oxide": true # tailwind v4 native engine
  # (additional entries added only if the resolved tree requires them)

# Error if a non-allowlisted dependency wants to build, rather than
# silently skipping it — forces an explicit decision.
strictDepBuilds: true

# Advisory floors for vulnerable transitives, caret-bounded (not bare ">=") so a
# re-resolve can't pull an unreviewed major; the committed lockfile pins the
# exact resolved versions. dompurify carried over from the old package.json
# "overrides"; rollup added empirically (ships as a vite transitive dep).
overrides:
  dompurify: "^3.4.0"
  # rollup ships as a vite transitive; vite requires ^4.34.9, already above the
  # CVE-2024-47068 / GHSA-gcx4-mw62-g8wm patch (4.22.4). Match vite's floor (not
  # a lower one — overrides replace, not intersect) and cap the major so a
  # re-resolve can't drop below vite's minimum or jump to an unreviewed v5.
  rollup: "^4.34.9"

# NEVER add `dangerouslyAllowAllBuilds: true` — it re-enables the
# run-all-scripts behavior pnpm 10 deliberately disabled.
